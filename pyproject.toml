[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "white-pepper-core"
version = "1.0.0"
description = "Headless scanner acquisition, computer vision deskewing, and document compilation engine."
readme = "README.md"
authors = [
    { name = "AceBurgundy", email = "Samadriansabalo99@gmail.com" }
]
license = { text = "Mozilla Public License 2.0 (MPL-2.0)" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL-2.0)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    "pywin32>=306; platform_system=='Windows'",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.scripts]
scan-cli = "scan_cli:main"
process-cli = "process_cli:main"
diagnostics-cli = "diagnostics_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["white_pepper*"]
